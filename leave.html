<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มขออนุมัติการลา</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #f0f2f5; } .card { border-radius: 15px; border: none; } </style>
</head>
<body>

<div class="container py-4" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
        <h4 class="fw-bold text-primary mb-4 text-center">📝 ยื่นคำขออนุมัติการลา</h4>

        <div class="mb-3">
            <label class="form-label fw-bold small">รหัสพนักงาน</label>
            <div class="input-group">
                <input type="text" id="empId" class="form-control" placeholder="กรอกรหัสพนักงาน" required>
                <button class="btn btn-outline-secondary" type="button" onclick="checkQuota()">เช็คสิทธิ์</button>
            </div>
        </div>

        <!-- กล่องแสดงสิทธิ์คงเหลือ -->
        <div id="quotaBox" class="alert alert-info d-none">
            <div class="fw-bold mb-1" id="empName">--</div>
            <div class="small">
                🌴 พักร้อนคงเหลือ: <span id="annRemain" class="fw-bold">0</span> วัน<br>
                💼 ลากิจคงเหลือ: <span id="perRemain" class="fw-bold">0</span> วัน<br>
                🏥 ลาป่วยใช้ไปแล้ว: <span id="sickUsed" class="fw-bold">0</span> วัน
            </div>
        </div>

        <form id="leaveForm">
            <div class="mb-3">
                <label class="form-label fw-bold small">ประเภทการลา</label>
                <select id="leaveType" class="form-select" required>
                    <option value="">-- เลือกประเภทการลา --</option>
                    <option value="พักร้อน">ลาพักร้อน</option>
                    <option value="ลากิจ">ลากิจ</option>
                    <option value="ลาป่วย">ลาป่วย</option>
                </select>
            </div>
            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label fw-bold small">ตั้งแต่วันที่</label>
                    <input type="date" id="startDate" class="form-control" required>
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold small">ถึงวันที่</label>
                    <input type="date" id="endDate" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">จำนวน (วัน)</label>
                <input type="number" step="0.5" id="days" class="form-control" placeholder="เช่น 1 หรือ 0.5" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">เหตุผลการลา</label>
                <textarea id="reason" class="form-control" rows="2" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="submitBtn">ส่งคำขออนุมัติ</button>
        </form>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxrTSaImYIS5hWMbGZFG0UkV_MEx5LGvK5JBz2is8T5MDHoXbfoZpU1mKWUX-yGx7FG/exec'; // ใส่ Web App URL ที่ได้จาก Apps Script

    async function checkQuota() {
        const empId = document.getElementById('empId').value.trim();
        if (!empId) { alert("กรุณากรอกรหัสพนักงาน"); return; }

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "getEmployeeQuota", payload: { empId } })
            });
            const result = await res.json();

            if (result.status === "error") throw new Error(result.message);

            document.getElementById('empName').innerText = result.data.name + " (" + result.data.department + ")";
            document.getElementById('annRemain').innerText = result.data.annualRemain;
            document.getElementById('perRemain').innerText = result.data.personalRemain;
            document.getElementById('sickUsed').innerText = result.data.sickUsed;
            document.getElementById('quotaBox').classList.remove('d-none');
        } catch(e) {
            alert("ไม่สามารถดึงข้อมูลได้: " + e.message);
            document.getElementById('quotaBox').classList.add('d-none');
        }
    }

    document.getElementById('leaveForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = 'กำลังส่งคำขอ...';

        const payload = {
            action: "requestLeave",
            payload: {
                empId: document.getElementById('empId').value.trim(),
                leaveType: document.getElementById('leaveType').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                days: document.getElementById('days').value,
                reason: document.getElementById('reason').value.trim()
            }
        };

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            alert(result.message);
            if (result.status === "success") {
                e.target.reset();
                document.getElementById('quotaBox').classList.add('d-none');
            }
        } catch(err) {
            alert("เกิดข้อผิดพลาดในการส่งคำขอ: " + err.message);
        } finally {
            btn.disabled = false; btn.innerText = 'ส่งคำขออนุมัติ';
        }
    });
</script>
</body>
</html>
