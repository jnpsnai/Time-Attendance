<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>HR | Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="fw-bold mb-4">Leave Management Dashboard</h2>
    
    <!-- Tab Navigation -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#dashboard">สรุปสิทธิ์การลา (Dashboard)</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#addEmp">ลงทะเบียนพนักงาน (Onboard)</a></li>
    </ul>

    <div class="tab-content">
        <!-- Dashboard Section -->
        <div class="tab-pane fade show active" id="dashboard">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <button class="btn btn-outline-primary mb-3" onclick="loadDashboard()">🔄 อัปเดตข้อมูล</button>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>รหัส</th><th>ชื่อ-สกุล</th><th>แผนก</th>
                                    <th>พักร้อน (เหลือ/สิทธิ์)</th>
                                    <th>ลากิจ (เหลือ/สิทธิ์)</th>
                                    <th>ลาป่วย (ใช้ไปแล้ว)</th>
                                </tr>
                            </thead>
                            <tbody id="dashboardTable">
                                <tr><td colspan="6" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Employee Section -->
        <div class="tab-pane fade" id="addEmp">
            <div class="card shadow-sm border-0 col-lg-8">
                <div class="card-body p-4">
                    <form id="empForm">
                        <div class="row mb-3">
                            <div class="col-md-4"><label>รหัสพนักงาน</label><input type="text" id="empId" class="form-control" required></div>
                            <div class="col-md-4"><label>ชื่อ</label><input type="text" id="firstname" class="form-control" required></div>
                            <div class="col-md-4"><label>นามสกุล</label><input type="text" id="lastname" class="form-control" required></div>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-6"><label>แผนก</label><input type="text" id="department" class="form-control" required></div>
                            <div class="col-md-6"><label>วันที่เริ่มงาน</label><input type="date" id="startDate" class="form-control" required></div>
                        </div>
                        <hr>
                        <h5 class="fw-bold mb-3">ตั้งค่าสิทธิ์การลาประจำปี (Quota)</h5>
                        <div class="row mb-4">
                            <div class="col-md-4"><label>สิทธิ์พักร้อน (วัน)</label><input type="number" id="annualQuota" class="form-control" required></div>
                            <div class="col-md-4"><label>สิทธิ์ลากิจ (วัน)</label><input type="number" id="personalQuota" class="form-control" required></div>
                            <div class="col-md-4"><label>สิทธิ์ลาป่วย (วัน)</label><input type="number" id="sickQuota" class="form-control" value="30" required></div>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">บันทึกข้อมูลพนักงาน</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'YOUR_WEB_APP_URL_HERE'; // ใส่ URL จาก Google Apps Script

    // Load Dashboard
    async function loadDashboard() {
        const tbody = document.getElementById('dashboardTable');
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({action: "getDashboard"}) });
            const data = await res.json();
            
            tbody.innerHTML = '';
            data.data.forEach(emp => {
                let annRemain = emp.annualQuota - emp.annualUsed;
                let perRemain = emp.personalQuota - emp.personalUsed;
                
                tbody.innerHTML += `
                    <tr>
                        <td>${emp.empId}</td><td>${emp.name}</td><td>${emp.department}</td>
                        <td class="${annRemain <= 0 ? 'text-danger fw-bold' : ''}">${annRemain} / ${emp.annualQuota}</td>
                        <td class="${perRemain <= 0 ? 'text-danger fw-bold' : ''}">${perRemain} / ${emp.personalQuota}</td>
                        <td class="text-warning fw-bold">${emp.sickUsed} วัน</td>
                    </tr>
                `;
            });
        } catch(e) { alert("เกิดข้อผิดพลาดในการโหลดข้อมูล"); }
    }

    // Submit New Employee
    document.getElementById('empForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            action: "addEmployee",
            payload: {
                empId: document.getElementById('empId').value,
                firstname: document.getElementById('firstname').value,
                lastname: document.getElementById('lastname').value,
                department: document.getElementById('department').value,
                startDate: document.getElementById('startDate').value,
                annualQuota: document.getElementById('annualQuota').value,
                personalQuota: document.getElementById('personalQuota').value,
                sickQuota: document.getElementById('sickQuota').value
            }
        };
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        alert(result.message);
        e.target.reset();
        loadDashboard();
    });

    window.onload = loadDashboard;
</script>
</body>
</html>
