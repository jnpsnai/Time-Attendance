<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR | Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="fw-bold mb-4">Leave Management Dashboard</h2>
    
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#dashboard">สรุปสิทธิ์การลา</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#addEmp">ลงทะเบียนพนักงาน</a></li>
    </ul>

    <div class="tab-content">
        <!-- Dashboard -->
        <div class="tab-pane fade show active" id="dashboard">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <button class="btn btn-outline-primary mb-3" onclick="loadDashboard()">🔄 อัปเดตข้อมูล</button>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>รหัส</th><th>ชื่อ-สกุล</th><th>แผนก</th>
                                    <th>พักร้อน (เหลือ/สิทธิ์)</th>
                                    <th>ลากิจ (เหลือ/สิทธิ์)</th>
                                    <th>ลาป่วย (ใช้ไปแล้ว)</th>
                                </tr>
                            </thead>
                            <tbody id="dashboardTable">
                                <tr><td colspan="6" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Employee Form -->
        <div class="tab-pane fade" id="addEmp">
            <div class="card shadow-sm border-0 col-lg-8">
                <div class="card-body p-4">
                    <form id="empForm">
                        <div class="row mb-3">
                            <div class="col-md-4"><label class="form-label">รหัสพนักงาน</label><input type="text" id="empId" class="form-control" required></div>
                            <div class="col-md-4"><label class="form-label">ชื่อ</label><input type="text" id="firstname" class="form-control" required></div>
                            <div class="col-md-4"><label class="form-label">นามสกุล</label><input type="text" id="lastname" class="form-control" required></div>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-6"><label class="form-label">แผนก</label><input type="text" id="department" class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">วันที่เริ่มงาน</label><input type="date" id="startDate" class="form-control" required></div>
                        </div>
                        <hr>
                        <h5 class="fw-bold mb-3">ตั้งค่าสิทธิ์การลาประจำปี (Quota)</h5>
                        <div class="row mb-4">
                            <div class="col-md-4"><label class="form-label">สิทธิ์พักร้อน (วัน)</label><input type="number" id="annualQuota" class="form-control" value="6" required></div>
                            <div class="col-md-4"><label class="form-label">สิทธิ์ลากิจ (วัน)</label><input type="number" id="personalQuota" class="form-control" value="3" required></div>
                            <div class="col-md-4"><label class="form-label">สิทธิ์ลาป่วย (วัน)</label><input type="number" id="sickQuota" class="form-control" value="30" required></div>
                        </div>
                        <button type="submit" class="btn btn-dark w-100" id="submitBtn">บันทึกข้อมูลพนักงาน</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // **นำ URL ที่ได้จากการ Deploy Apps Script มาวางตรงนี้**
    const API_URL = 'YOUR_WEB_APP_URL_HERE';

    // โหลด Dashboard
    async function loadDashboard() {
        const tbody = document.getElementById('dashboardTable');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">กำลังโหลดข้อมูล...</td></tr>';
        
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "getDashboard" })
            });
            const result = await res.json();
            
            if (result.status === "error") throw new Error(result.message);

            tbody.innerHTML = '';
            result.data.forEach(emp => {
                let annRemain = emp.annualQuota - emp.annualUsed;
                let perRemain = emp.personalQuota - emp.personalUsed;
                
                tbody.innerHTML += `
                    <tr>
                        <td>${emp.empId}</td>
                        <td>${emp.name}</td>
                        <td>${emp.department}</td>
                        <td class="${annRemain <= 0 ? 'text-danger fw-bold' : ''}">${annRemain} / ${emp.annualQuota}</td>
                        <td class="${perRemain <= 0 ? 'text-danger fw-bold' : ''}">${perRemain} / ${emp.personalQuota}</td>
                        <td class="text-warning fw-bold">${emp.sickUsed} วัน</td>
                    </tr>
                `;
            });
        } catch(e) { 
            tbody.innerHTML = `<tr><td colspan="6" class="text-danger text-center">เกิดข้อผิดพลาด: ${e.message}</td></tr>`;
        }
    }

    // บันทึกพนักงานใหม่
    document.getElementById('empForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'กำลังบันทึก...';

        const payload = {
            action: "addEmployee",
            payload: {
                empId: document.getElementById('empId').value.trim(),
                firstname: document.getElementById('firstname').value.trim(),
                lastname: document.getElementById('lastname').value.trim(),
                department: document.getElementById('department').value.trim(),
                startDate: document.getElementById('startDate').value,
                annualQuota: document.getElementById('annualQuota').value,
                personalQuota: document.getElementById('personalQuota').value,
                sickQuota: document.getElementById('sickQuota').value
            }
        };

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            
            alert(result.message);
            if (result.status === "success") {
                e.target.reset();
                loadDashboard();
            }
        } catch(err) {
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'บันทึกข้อมูลพนักงาน';
        }
    });

    window.onload = loadDashboard;
</script>
</body>
</html>
