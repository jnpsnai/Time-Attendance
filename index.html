<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal | Time Attendance</title>
    <!-- Bootstrap 5 & SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .terminal-card { max-width: 450px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: none; }
        .clock { font-size: 2.5rem; font-weight: bold; color: #2c3e50; }
        .date-display { color: #7f8c8d; font-size: 1.1rem; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="card terminal-card p-4 bg-white text-center">
    <h4 class="mb-4 text-primary fw-bold">CORPORATE PORTAL</h4>
    <div class="clock" id="clock">00:00:00</div>
    <div class="date-display" id="dateDisplay">Loading date...</div>

    <form id="attendanceForm" class="text-start">
        <div class="mb-3">
            <label class="form-label text-muted small fw-bold">รหัสพนักงาน (Employee ID)</label>
            <input type="text" class="form-control form-control-lg" id="empId" placeholder="กรอกรหัสพนักงาน" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small fw-bold">สถานที่ (Location)</label>
            <select class="form-select form-select-lg" id="location" required>
                <option value="" disabled selected>-- เลือกสถานที่ปฏิบัติงาน --</option>
                <option value="สำนักงานใหญ่">Headquarters (สำนักงานใหญ่)</option>
                <option value="สาขา 1">Branch 01</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" id="submitBtn">บันทึกเวลา (Clock In/Out)</button>
    </form>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxrTSaImYIS5hWMbGZFG0UkV_MEx5LGvK5JBz2is8T5MDHoXbfoZpU1mKWUX-yGx7FG/exec'; // ใส่ URL ที่ Deploy ใหม่

    // Real-time Clock
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
        document.getElementById('dateDisplay').innerText = now.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }, 1000);

    // Form Submission
    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';

        const payload = {
            action: "attendance",
            payload: {
                empId: document.getElementById('empId').value.trim(),
                location: document.getElementById('location').value
            }
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const result = await response.json();

            if (result.status === "success") {
                Swal.fire({ icon: 'success', title: 'Success', text: result.message, confirmButtonColor: '#0d6efd' });
                document.getElementById('attendanceForm').reset();
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'System Error', text: error.message, confirmButtonColor: '#dc3545' });
        } finally {
            btn.disabled = false;
            btn.innerText = 'บันทึกเวลา (Clock In/Out)';
        }
    });
</script>
</body>
</html>
